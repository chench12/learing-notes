<polyline points="1180,230 1180,340" fill="none" stroke="#2563c4" stroke-width="3"/>
<polygon points="1180.00,340.00 1172.61,324.69 1187.39,324.69" fill="#2563c4"/>
<polyline points="1010,415 870,415" fill="none" stroke="#2563c4" stroke-width="3"/>
<polygon points="870.00,415.00 885.31,407.61 885.31,422.39" fill="#2563c4"/>
<polyline points="530,415 390,415" fill="none" stroke="#2563c4" stroke-width="3"/>
<polygon points="390.00,415.00 405.31,407.61 405.31,422.39" fill="#2563c4"/>
<text x="460" y="390" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#2563c4">否</text>
<polyline points="700,490 700,610" fill="none" stroke="#2563c4" stroke-width="3"/>
<polygon points="700.00,610.00 692.61,594.69 707.39,594.69" fill="#2563c4"/>
<text x="730" y="550" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#2563c4">是</text>
<polyline points="220,490 220,610" fill="none" stroke="#2563c4" stroke-width="3"/>
<polygon points="220.00,610.00 212.61,594.69 227.39,594.69" fill="#2563c4"/>
<polyline points="220,750 220,825 1180,825 1180,490" fill="none" stroke="#2563c4" stroke-width="3" stroke-dasharray="11 9"/>
<polygon points="1180.00,490.00 1187.39,505.31 1172.61,505.31" fill="#2563c4"/>
<text x="700" y="860" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#263447">改进提示保留历史；最终输出不保证每轮质量单调提高</text>
</svg>